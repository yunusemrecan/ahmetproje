[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pyvot"
dynamic = ["version"]
description = "Python sürümlerini, paketlerini ve projelerini yöneten Windows uygulaması"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "PySide6-Addons>=6.12",
    # Qt 6.12'den beri QtWebEngine (Monaco editörü) ayrı bir paket; Addons'ta yok.
    "PySide6-WebEngine>=6.12",
    "packaging>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff==0.17.6"]

[project.gui-scripts]
pyvot = "pyvot.app:main"

[tool.hatch.version]
path = "src/pyvot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyvot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Takılan bir test (ör. beklenmeyen bir pencere) tüm CI'ı kilitlemesin; nerede
# takıldığı yazdırılır.
timeout = 180
timeout_method = "thread"
markers = [
    "network: needs internet access (PyPI)",
]
