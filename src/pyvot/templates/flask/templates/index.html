<!doctype html>
<html lang="{{t:html_lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>{{ title }}</h1>
    <p class="muted">{{t:web_intro}}</p>
    <form method="post" action="{{ url_for('add') }}">
      <input name="note" placeholder="{{t:web_placeholder}}" autofocus required>
      <button type="submit">{{t:web_add}}</button>
    </form>
    {% if notes %}
    <ul>
      {% for note in notes %}<li>{{ note }}</li>{% endfor %}
    </ul>
    {% else %}
    <p class="muted">{{t:web_empty}}</p>
    {% endif %}
  </main>
</body>
</html>
