name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Qt için sistem kütüphaneleri (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" uv==0.11.32

      - name: Testler
        run: python -m pytest -v

  windows:
    name: Windows paketi
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: Pyvot-${{ steps.version.outputs.version }}-windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Araçları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install . -r requirements-build.txt

      - name: Sürümü oku
        id: version
        shell: pwsh
        run: |
          $v = python -c "import pyvot; print(pyvot.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: PyInstaller
        run: |
          python scripts/write_version_info.py
          pyinstaller --noconfirm pyvot.spec
          python scripts/bundle_uv.py

      - name: Çalışma denemesi
        shell: pwsh
        run: |
          & dist\Pyvot\uv.exe --version
          if ($LASTEXITCODE -ne 0) { throw "uv.exe çalışmadı" }
          $p = Start-Process -FilePath dist\Pyvot\Pyvot.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Pyvot.exe açıldıktan hemen sonra kapandı (çıkış kodu $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Pyvot.exe 15 saniye açık kaldı."

      - name: Kurulum dosyası (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) {
              choco install innosetup --no-progress -y
            }
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} installer\pyvot.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup başarısız" }

      - name: Taşınabilir zip ve SHA256
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist\Pyvot -DestinationPath "out\Pyvot-$v-portable.zip"
          Copy-Item "installer\Output\Pyvot-Setup-$v.exe" out\
          Get-ChildItem out -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content out\SHA256SUMS.txt
          Get-Content out\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Pyvot-${{ steps.version.outputs.version }}-windows
          path: out/*
          if-no-files-found: error

  nightly:
    name: Nightly sürümü yayınla
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.windows.outputs.artifact }}
          path: in

      - name: Dosyaları sabit adlarla hazırla
        run: |
          mkdir out
          cp in/Pyvot-Setup-*.exe out/Pyvot-Setup.exe
          cp in/Pyvot-*-portable.zip out/Pyvot-portable.zip
          (cd out && sha256sum Pyvot-Setup.exe Pyvot-portable.zip > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt

      - name: nightly sürümünü yeniden oluştur
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          version="${{ needs.windows.outputs.version }}"
          cat > notes.md <<NOTES
          Her \`main\` gönderiminden otomatik üretilen **test sürümü**. Kararlı değildir.

          - Sürüm: \`$version\` · Commit: [\`$short\`](https://github.com/$GH_REPO/commit/$GITHUB_SHA) · $(date -u '+%Y-%m-%d %H:%M UTC')
          - **Pyvot-Setup.exe**: kurulum sihirbazı (yönetici izni gerekmez)
          - **Pyvot-portable.zip**: kurulumsuz sürüm; açıp \`Pyvot.exe\`'yi çalıştırın
          - **SHA256SUMS.txt**: dosyaların doğrulama kodları

          Uygulama imzalı olmadığı için Windows SmartScreen uyarabilir: **Ek bilgi → Yine de çalıştır**.
          NOTES
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly out/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Pyvot nightly ($version, $short)" \
            --notes-file notes.md
